name: DAKAFARM images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/src/**
      - frontend/public/**
      - frontend/index.html
      - frontend/package*.json
      - frontend/.npmrc
      - Dockerfile.*
      - deploy/**
      - .dockerignore
      - .github/workflows/dakafarm.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: dakafarm-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    if: github.repository == 'saasMsDGH/dakafarm'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/saasmsdgh/dakafarm-${{ matrix.component }}:build-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/saasMsDGH/dakafarm
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          provenance: true
          sbom: true
          cache-from: type=gha,scope=dakafarm-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=dakafarm-${{ matrix.component }}
      - name: Immutable deployment reference
        env:
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'Image %s digest %s\n' "$COMPONENT" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
